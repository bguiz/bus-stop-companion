<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Bus stop aibou</title>
  <meta name="description" content="Live Singapore bus arrivals, each bus a hidden anime character.">
  <meta name="theme-color" content="#1b2a4a">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body data-weather="fair">
  <header class="top">
    <div class="stopline">
      <button id="home" class="iconbtn" type="button" aria-label="Home" hidden>&#8962;</button>
      <button id="change-stop" class="stopbtn" type="button" aria-label="Change bus stop">
        <span id="stop-name" class="stopname">Pick a bus stop</span>
        <span id="stop-meta" class="stopmeta"></span>
      </button>
      <button id="refresh" class="iconbtn" type="button" aria-label="Refresh arrivals" hidden>&#8635;</button>
    </div>
    <p id="weather" class="weather" hidden></p>
  </header>

  <main>
    <section id="landing" class="landing" hidden>
      <h1>Bus stop aibou <span class="jp" lang="ja">相棒</span></h1>
      <p class="tagline">Every Singapore bus hides a character. Pick your stop to meet yours.</p>
      <div id="carousel" class="carousel" role="region" aria-roledescription="carousel" aria-label="A peek at buses and their characters" tabindex="0">
        <div id="track" class="track"></div>
      </div>
      <div id="dots" class="dots" aria-hidden="true"></div>
      <p id="recent" class="recent" hidden></p>
    </section>

    <section id="picker" class="picker" hidden>
      <label class="sr" for="stop-search">Search bus stops by name, road or code</label>
      <input id="stop-search" type="search" placeholder="Search name, road or stop code" autocomplete="off" enterkeyhint="search">
      <button id="nearest" class="primary" type="button">Use my location</button>
      <button id="picker-cancel" type="button" hidden>Cancel</button>
      <p id="picker-msg" class="msg" role="status"></p>
      <ul id="results" class="results"></ul>
    </section>

    <nav id="tabs" class="tabs" role="tablist" aria-label="Views" hidden>
      <button type="button" role="tab" id="tab-board" data-tab="board" aria-controls="board" aria-selected="true" tabindex="0">Buses</button>
      <button type="button" role="tab" id="tab-scene" data-tab="scene" aria-controls="scene" aria-selected="false" tabindex="-1">Scene</button>
      <button type="button" role="tab" id="tab-collection" data-tab="collection" aria-controls="collection" aria-selected="false" tabindex="-1">Collection</button>
    </nav>

    <p id="board-status" class="msg" role="status" hidden></p>
    <section id="board" class="board" role="tabpanel" aria-labelledby="tab-board"></section>

    <section id="scene" class="scenebox" role="tabpanel" aria-labelledby="tab-scene" hidden>
      <canvas id="scene-canvas" role="img" aria-label="Map of buses near your stop, drawn as their characters"></canvas>
      <div class="scenebar">
        <label><input id="taxi-toggle" type="checkbox" checked> Taxi spirits</label>
        <span id="scene-note" class="msg"></span>
      </div>
    </section>

    <section id="collection" class="collection" role="tabpanel" aria-labelledby="tab-collection" hidden>
      <p id="collection-stats" class="msg"></p>
      <div id="collection-grid" class="grid"></div>
      <div id="collection-detail" class="detail" hidden></div>
    </section>
  </main>

  <p id="announcer" class="sr" role="status" aria-live="polite"></p>

  <footer class="foot">
    <p id="open-days"></p>
    <p>Bus times: <a href="https://github.com/cheeaun/arrivelah">arrivelah</a> (LTA data). Weather and taxis: <a href="https://data.gov.sg">data.gov.sg</a>. Characters and artwork: <a href="https://anilist.co">AniList</a>, owned by their rights holders. A fan-made toy, not affiliated with any of them.</p>
  </footer>

  <script type="module" src="app.js"></script>
</body>
</html>
